name: Windows Release Installers

permissions:
  contents: write

# Tag push `v*` builds both installers (mini + full) and attaches them to the matching release.
# The whisper runtimes for `full` come from the pinned manifest
# (src-tauri/runtime-manifests/whisper-runtime-*.json): URL + SHA-256, verified before use.
# workflow_dispatch (no inputs) is a dry run: it builds and uploads the workflow artifact only.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:REF_NAME) {
            throw "Tag $env:REF_NAME does not match package.json version v$version."
          }

      - name: Install NPM dependencies
        run: npm ci

      - name: Fetch pinned whisper runtimes (CUDA + Vulkan)
        run: node scripts/fetch-whisper-runtime.mjs --variants cuda,vulkan

      - name: Build installers (mini + full)
        shell: cmd
        run: scripts\windows\build-installers.bat mini full

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ github.run_id }}
          path: installers/*.exe
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*.exe
          fail_on_unmatched_files: true
