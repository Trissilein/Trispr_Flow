<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- TF monogram, matching Tris Refain's chip-on-dark style (see
       D:\GIT\tris-refain\src-tauri\icons\icon.png) but reusing Trispr Flow's
       own established brand colors from ICON_README.md (cyan/gold), so the
       two apps read as a family without inventing a new palette. -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="#1A1D27"/>

  <!-- T (cyan) - block letterform via two rects, no font dependency so it
       stays crisp and identical across every rasterized size. -->
  <rect x="36" y="68" width="88" height="28" fill="#17BEDB"/>
  <rect x="66" y="68" width="28" height="120" fill="#17BEDB"/>

  <!-- F (gold) - block letterform via three rects. -->
  <rect x="134" y="68" width="28" height="120" fill="#FFC107"/>
  <rect x="134" y="68" width="76" height="26" fill="#FFC107"/>
  <rect x="134" y="118" width="58" height="24" fill="#FFC107"/>
</svg>
